[mypy]
# Kept at the lowest version we still support (see pyproject.toml) so mypy
# flags any accidental use of newer syntax in our own code. Must be >=3.10
# because newer third-party deps (e.g. click) ship source using match
# statements, which mypy needs to parse under a supporting target version.
python_version = 3.10
warn_unused_configs = True

[mypy-backoff.*]
ignore_missing_imports = True
